name: Checks

on:
  # Automatic push/PR runs are temporarily paused. Run manually when needed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Formatting, unit tests and build
        run: npm run format:check && npm test && npm run build
      # Mobile browser tests are paused until helpers handle collapsed panels and hidden controls.
      # Keep them available locally through npm run test:e2e -- --project=mobile.
      - name: Desktop browser tests
        run: npm run test:e2e -- --project=desktop
      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
