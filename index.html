<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#211c36" />
    <title>Wilderness Almanac</title>
    <style>
      html {
        background: #171321;
        color: #f1e8db;
        color-scheme: dark;
      }
      body {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <link rel="preload" href="/fonts/geist-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/geist-pixel-square.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <section id="campaign-menu" class="campaign-menu" aria-labelledby="almanac-title">
        <hgroup class="almanac-heading">
          <h1 id="almanac-title"><span>Wilderness</span> <span>Almanac</span></h1>
          <p>DM toolbox for sandbox RPG campaigns</p>
        </hgroup>
        <section class="campaign-library" aria-labelledby="campaign-library-title">
          <header class="campaign-toolbar cluster">
            <h2 id="campaign-library-title">Your campaigns <span id="campaign-count">0</span></h2>
            <button type="button" id="import-campaign" class="menu-button">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#upload"></use>
              </svg>
              Import campaign
            </button>
            <input type="file" id="campaign-file" accept=".json,application/json" hidden />
          </header>
          <ul id="campaign-list" class="campaign-list stack" aria-label="Saved campaigns"></ul>
          <button type="button" id="new-campaign" class="new-campaign cluster">
            <svg class="ui-icon new-campaign-symbol" viewBox="0 0 24 24" aria-hidden="true">
              <use href="/icons/pixelarticons.svg#plus"></use>
            </svg>
            <span><strong>New campaign</strong><span>An unexplored world</span></span>
            <svg class="ui-icon new-campaign-arrow" viewBox="0 0 24 24" aria-hidden="true">
              <use href="/icons/pixelarticons.svg#arrow-right"></use>
            </svg>
          </button>
          <p class="campaign-storage-note">
            Saved on this device. Export a campaign to take it with you.
          </p>
          <div id="campaign-save-warning" class="save-warning" role="status" hidden>
            <p id="campaign-save-message"></p>
          </div>
          <div id="campaign-recovery" class="save-warning" role="status" hidden>
            <p id="campaign-recovery-message"></p>
            <button type="button" id="download-campaign-recovery" class="menu-button">
              Download recovery file
            </button>
          </div>
          <div class="campaign-feedback stack">
            <output id="campaign-message" class="campaign-message" aria-live="polite"></output>
            <button type="button" id="undo-delete-campaign" class="menu-button" hidden>
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#undo"></use>
              </svg>
              Undo deletion
            </button>
          </div>
        </section>
        <dialog
          id="delete-campaign-dialog"
          aria-labelledby="delete-campaign-title"
          aria-describedby="delete-campaign-description"
        >
          <form method="dialog">
            <span class="dialog-eyebrow">Campaign management</span>
            <h2 id="delete-campaign-title">Delete campaign?</h2>
            <p id="delete-campaign-description">
              Remove <strong id="delete-campaign-name"></strong> from this device?
            </p>
            <div class="dialog-actions cluster">
              <button class="menu-button" value="cancel" autofocus>Keep campaign</button>
              <button class="menu-button menu-danger" value="delete">Delete campaign</button>
            </div>
          </form>
        </dialog>
      </section>
      <template id="campaign-template">
        <li class="campaign-card">
          <div class="campaign-icon">
            <button
              type="button"
              class="campaign-icon-toggle"
              data-action="icon-controls"
              aria-label="Show campaign icon controls"
              aria-expanded="false"
            >
              <span class="campaign-icon-placeholder" aria-hidden="true"></span>
              <img width="112" height="112" alt="" hidden />
            </button>
            <button
              type="button"
              class="menu-icon-button campaign-icon-refresh"
              data-action="shuffle"
              aria-label="Next campaign icon"
              title="Next cached world icon"
            >
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#refresh"></use>
              </svg>
            </button>
          </div>
          <div class="campaign-details">
            <form class="campaign-name-form">
              <input
                class="campaign-name"
                type="text"
                maxlength="100"
                required
                autocomplete="off"
                spellcheck="false"
              />
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#pencil"></use>
              </svg>
            </form>
            <dl class="campaign-metadata">
              <div>
                <dt>Created</dt>
                <dd><time class="campaign-date"></time></dd>
              </div>
              <div>
                <dt>Palette</dt>
                <dd class="campaign-palette"></dd>
              </div>
              <div>
                <dt>Settlements</dt>
                <dd class="campaign-settlements"></dd>
              </div>
              <div>
                <dt>POIs</dt>
                <dd class="campaign-pois"></dd>
              </div>
              <div class="campaign-ratio">
                <dt>Water / land</dt>
                <dd></dd>
              </div>
            </dl>
            <div class="campaign-seed-row">
              <span>Seed <span class="campaign-seed"></span></span>
              <button
                type="button"
                class="menu-icon-button"
                data-action="copy"
                aria-label="Copy seed"
                title="Copy seed"
              >
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <use href="/icons/pixelarticons.svg#copy"></use>
                </svg>
              </button>
              <button
                type="button"
                class="menu-icon-button"
                data-action="share"
                aria-label="Share map"
                title="Share map"
              >
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <use href="/icons/pixelarticons.svg#share"></use>
                </svg>
              </button>
            </div>
          </div>
          <div class="campaign-actions">
            <button
              type="button"
              class="menu-icon-button campaign-enter"
              data-action="enter"
              aria-label="Enter campaign"
              title="Enter campaign"
            >
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#login"></use>
              </svg>
            </button>
            <button
              type="button"
              class="menu-icon-button"
              data-action="download"
              aria-label="Download campaign JSON"
              title="Download campaign JSON"
            >
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#download"></use>
              </svg>
            </button>
            <button
              type="button"
              class="menu-icon-button campaign-delete"
              data-action="delete"
              aria-label="Delete campaign"
              title="Delete campaign"
            >
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#trash"></use>
              </svg>
            </button>
          </div>
        </li>
      </template>
      <section id="campaign-workspace" aria-label="Campaign workspace" hidden>
        <header class="hp-top cluster">
          <button
            type="button"
            id="hp-mobile-menu"
            class="hp-mobile-only hp-mobile-menu"
            aria-label="Return to campaign menu"
            title="Return to campaign menu"
          >
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
              <use href="/icons/pixelarticons.svg#arrow-left"></use>
            </svg>
          </button>
          <hgroup class="hp-heading">
            <h1 class="hp-title">The quiet frontier</h1>
            <p class="hp-seed">
              Seed <output id="hp-current-seed"></output>
              <button
                type="button"
                class="hp-seed-action"
                id="hp-copy-seed"
                aria-label="Copy seed"
                title="Copy seed"
              >
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <use href="/icons/pixelarticons.svg#copy"></use>
                </svg>
              </button>
              <button
                type="button"
                class="hp-seed-action"
                id="hp-share-map"
                aria-label="Share map"
                title="Copy seed link. Transfer hex edits with campaign JSON."
              >
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <use href="/icons/pixelarticons.svg#share"></use>
                </svg>
              </button>
            </p>
          </hgroup>
          <div class="hp-tools cluster">
            <span class="hp-new-map-actions">
              <button type="button" id="hp-new-map">New Map</button>
              <button
                type="button"
                id="hp-map-settings"
                aria-label="New map settings"
                title="New map settings"
              >
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <use href="/icons/pixelarticons.svg#settings-cog"></use>
                </svg>
              </button>
            </span>
            <button type="button" id="hp-regenerate">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#refresh"></use>
              </svg>
              Regenerate
            </button>
            <span class="hp-zooms" role="group" aria-label="Map zoom">
              <button class="hp-zoom" id="hp-out" type="button" aria-label="Zoom out">
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <use href="/icons/pixelarticons.svg#minus"></use>
                </svg>
              </button>
              <button class="hp-zoom" id="hp-in" type="button" aria-label="Zoom in">
                <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <use href="/icons/pixelarticons.svg#plus"></use>
                </svg>
              </button>
            </span>
          </div>
        </header>
        <div class="hp-map-stage">
          <div class="hp-scene" id="hp-scene">
            <div class="hp-fallback" id="hp-loading">Preparing the landscape…</div>
          </div>
          <div
            class="hp-mobile-only hp-mobile-map-controls"
            role="group"
            aria-label="Map view controls"
          >
            <button
              type="button"
              id="hp-expand-map"
              class="hp-mobile-only hp-expand-map"
              aria-label="Expand map to viewport"
              aria-pressed="false"
              title="Expand map to viewport"
            >
              <svg class="ui-icon hp-expand-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#scale"></use>
              </svg>
              <svg class="ui-icon hp-collapse-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#close"></use>
              </svg>
            </button>
            <button class="hp-zoom" id="hp-mobile-in" type="button" aria-label="Zoom in">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#plus"></use>
              </svg>
            </button>
            <button class="hp-zoom" id="hp-mobile-out" type="button" aria-label="Zoom out">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#minus"></use>
              </svg>
            </button>
          </div>
        </div>
        <div class="hp-status">
          <select id="hp-selection" aria-label="Selected hex"></select>
          <output id="hp-message" aria-live="off"></output>
          <span
            id="hp-announcement"
            class="sr-only"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></span>
        </div>
        <div id="hp-save-warning" class="save-warning" role="status" hidden>
          <p id="hp-save-message"></p>
          <button type="button" id="hp-download-unsaved">Download campaign</button>
        </div>
        <section class="hp-map-options" id="hp-map-options" aria-label="Palette and settings">
          <form class="hp-palette" id="hp-palette-form">
            <div class="hp-colors stack">
              <label class="hp-color">
                <span class="hp-swatch">
                  <input
                    type="color"
                    id="hp-ground"
                    value="#cdab8f"
                    aria-label="Ground seed colour"
                  />
                </span>
                <span>Ground<code class="hp-hex-code" id="hp-ground-value">#CDAB8F</code></span>
              </label>
              <label class="hp-color">
                <span class="hp-swatch">
                  <input
                    type="color"
                    id="hp-water"
                    value="#0b365e"
                    aria-label="Water seed colour"
                  />
                </span>
                <span>Water<code class="hp-hex-code" id="hp-water-value">#0B365E</code></span>
              </label>
              <label class="hp-color">
                <span class="hp-swatch">
                  <input
                    type="color"
                    id="hp-elements"
                    value="#11b329"
                    aria-label="Elements seed colour"
                  />
                </span>
                <span>Elements<code class="hp-hex-code" id="hp-elements-value">#11B329</code></span>
              </label>
            </div>
            <div class="hp-palette-controls stack">
              <select id="hp-preset" aria-label="Colour palette">
                <option value="forbidden">Forbidden Lands</option>
                <option value="dusk">Dusk &amp; gold</option>
                <option value="ember">Ember coast</option>
                <option value="moss">Moss &amp; bone</option>
                <option value="classic">Verdant Kingdoms</option>
                <option value="thronefall">Thronefall</option>
                <option value="glacial">Glacial mint</option>
                <option value="autumn">Autumn copper</option>
                <option value="sand">Sand &amp; sage</option>
                <option value="custom" hidden>Custom</option>
              </select>
              <div id="hp-palette-create" class="hp-palette-create stack">
                <label class="sr-only" for="hp-palette-name">Palette name</label>
                <input
                  id="hp-palette-name"
                  type="text"
                  maxlength="60"
                  required
                  placeholder="New palette name"
                  autocomplete="off"
                />
                <button type="submit">Save palette</button>
              </div>
            </div>
            <div class="hp-map-navigation stack">
              <button
                type="button"
                id="hp-motion"
                class="hp-motion"
                role="switch"
                aria-checked="true"
                aria-label="Wind"
              >
                <span class="hp-motion-light" aria-hidden="true"></span>
                <span>Wind is <span id="hp-motion-state" aria-hidden="true">ON</span></span>
              </button>
              <div class="hp-panel-actions">
                <button
                  type="button"
                  id="hp-toggle-settings"
                  aria-label="Collapse palette and settings"
                  title="Collapse palette and settings"
                  aria-expanded="true"
                  aria-controls="hp-palette-form"
                >
                  <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <use href="/icons/pixelarticons.svg#chevron-up"></use>
                  </svg>
                </button>
                <button
                  type="button"
                  id="hp-return-menu"
                  aria-label="Return to menu"
                  title="Return to menu"
                >
                  <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <use href="/icons/pixelarticons.svg#arrow-left"></use>
                  </svg>
                  <span class="hp-return-label">Return to menu</span>
                </button>
              </div>
            </div>
          </form>
        </section>
        <dialog id="hp-new-map-dialog" aria-labelledby="hp-dialog-title">
          <form id="hp-new-map-form" class="hp-new-map-form stack">
            <h2 id="hp-dialog-title">New Map</h2>
            <label for="hp-seed">Map seed</label>
            <input
              id="hp-seed"
              name="seed"
              type="text"
              maxlength="128"
              required
              autocomplete="off"
              spellcheck="false"
            />
            <div class="hp-tools cluster">
              <button id="hp-cancel-new-map" type="button">Cancel</button>
              <button type="submit">Create map</button>
            </div>
          </form>
        </dialog>
      </section>
    </main>

    <template id="tool-panel-template">
      <section class="hp-tool-panel">
        <header class="hp-panel-bar cluster">
          <h2></h2>
          <div class="hp-panel-buttons">
            <button
              type="button"
              class="hp-panel-order hp-move-up"
              data-direction="-1"
              title="Move panel up"
            >
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#arrow-bar-up"></use>
              </svg>
            </button>
            <button
              type="button"
              class="hp-panel-order hp-move-down"
              data-direction="1"
              title="Move panel down"
            >
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#arrow-bar-down"></use>
              </svg>
            </button>
            <button type="button" class="hp-panel-horizontal" data-horizontal>
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#chevron-up"></use>
              </svg>
            </button>
            <button type="button" data-collapse>
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#chevron-up"></use>
              </svg>
            </button>
          </div>
        </header>
        <div class="hp-panel-body"></div>
      </section>
    </template>
    <template id="hex-inspector-template">
      <div class="hp-inspector-overview">
        <button
          type="button"
          id="hp-hex-visited"
          class="hp-motion hp-hex-visited"
          role="switch"
          aria-label="Visited"
        >
          <span class="hp-motion-light" aria-hidden="true"></span>
          <span id="hp-hex-visited-state">Not yet visited</span>
        </button>
        <div class="hp-hex-preview-frame">
          <img id="hp-hex-preview" width="240" height="240" alt="" />
        </div>
        <div class="hp-inspector-heading">
          <span class="hp-eyebrow">Selected hex</span>
          <h3 id="hp-hex-name"></h3>
          <span id="hp-hex-address" class="hp-pixel"></span>
          <dl class="hp-hex-distances" aria-label="Distances in hex steps">
            <div>
              <dt>Nearest settlement</dt>
              <dd id="hp-hex-distance-settlement"></dd>
            </div>
            <div>
              <dt>Nearest river</dt>
              <dd id="hp-hex-distance-river"></dd>
            </div>
            <div>
              <dt>Nearest open water</dt>
              <dd id="hp-hex-distance-water"></dd>
            </div>
          </dl>
        </div>
      </div>
      <form id="hp-hex-form" class="hp-inspector-content" aria-labelledby="hp-hex-name">
        <fieldset id="hp-hex-fields" class="hp-hex-fields grid-pair" disabled>
          <label>
            Terrain
            <select id="hp-hex-terrain" aria-label="Terrain"></select>
          </label>
          <label>
            Settlement
            <select id="hp-hex-settlement" aria-label="Settlement"></select>
          </label>
          <label>
            Point of interest
            <select id="hp-hex-poi" aria-label="Point of interest"></select>
          </label>
          <label id="hp-hex-subtype-label">
            POI variant
            <select id="hp-hex-subtype" aria-label="POI variant"></select>
          </label>
          <label>
            Elevation
            <select id="hp-hex-elevation" aria-label="Elevation">
              <option value="0">0 · Lowland</option>
              <option value="1">1 · Low rise</option>
              <option value="2">2 · Upland</option>
              <option value="3">3 · Highland</option>
              <option value="4">4 · Mountains</option>
            </select>
          </label>
          <label>
            Crossing
            <select id="hp-hex-crossing" aria-label="Crossing">
              <option value="">None</option>
              <option value="bridge">Bridge</option>
              <option value="ferry">Ferry</option>
            </select>
          </label>
          <p id="hp-hex-constraint" class="hp-field-note" hidden></p>
        </fieldset>
        <output id="hp-hex-feedback" class="hp-hex-feedback" role="alert"></output>
        <div class="hp-inspector-action-cluster">
          <div class="hp-inspector-edit-actions">
            <button type="button" id="hp-hex-edit">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#pencil"></use>
              </svg>
              Edit hex
            </button>
            <button type="submit" id="hp-hex-apply" hidden>Apply changes</button>
            <button type="button" id="hp-hex-cancel" hidden>Cancel</button>
            <button type="button" id="hp-hex-undo">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#undo"></use>
              </svg>
              Undo
            </button>
            <button type="button" id="hp-hex-reset">Reset hex</button>
          </div>
          <div class="hp-inspector-actions">
            <button type="button" id="hp-hex-regenerate">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#refresh"></use>
              </svg>
              Regenerate hex
            </button>
            <button type="button" id="hp-hex-lock" role="switch" aria-label="Lock hex dressing">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="/icons/pixelarticons.svg#lock"></use>
              </svg>
              <span id="hp-hex-lock-state"></span>
            </button>
            <button type="button" id="hp-hex-icon">Set as world icon</button>
          </div>
        </div>
      </form>
    </template>
    <template id="unsaved-hex-dialog-template">
      <dialog class="hp-inspector-dialog" aria-labelledby="hp-unsaved-title">
        <h2 id="hp-unsaved-title">Unapplied hex changes</h2>
        <p>Apply or discard your changes before inspecting another hex.</p>
        <div class="hp-tools cluster">
          <button type="button" data-unsaved="keep">Keep editing</button>
          <button type="button" data-unsaved="discard">Discard</button>
          <button type="button" data-unsaved="apply">Apply changes</button>
        </div>
      </dialog>
    </template>
    <template id="replace-world-dialog-template">
      <dialog aria-labelledby="hp-replace-title">
        <h2 id="hp-replace-title">Replace this world?</h2>
        <p>
          A new map clears hex edits, visited statuses and dressing locks in this campaign. Export
          the campaign first to keep a copy.
        </p>
        <div class="hp-tools cluster">
          <button type="button" data-replace="cancel">Keep world</button>
          <button type="button" data-replace="confirm">Create new map</button>
        </div>
      </dialog>
    </template>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
