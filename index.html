<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#211c36" />
    <title>Wilderness Almanac</title>
  </head>
  <body>
    <main>
      <section id="campaign-menu" class="campaign-menu" aria-labelledby="almanac-title">
        <header class="almanac-heading">
          <svg class="almanac-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="m24 3 19 11v22L24 47 5 36V14Z" stroke="currentColor" />
            <path d="m5 14 19 11 19-11M24 25v22M14 30l10-17 10 17-10-5Z" stroke="currentColor" />
          </svg>
          <h1 id="almanac-title">Wilderness Almanac</h1>
          <p>A place for your worlds.</p>
        </header>
        <div class="campaign-library">
          <div class="campaign-toolbar">
            <h2>Your campaigns <span id="campaign-count">0</span></h2>
            <button type="button" id="import-campaign" class="menu-button">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path d="M12 16V3m-4 4 4-4 4 4M4 14v6h16v-6" />
              </svg>
              Import campaign
            </button>
            <input type="file" id="campaign-file" accept=".json,application/json" hidden />
          </div>
          <ul id="campaign-list" class="campaign-list" aria-label="Saved campaigns"></ul>
          <button type="button" id="new-campaign" class="new-campaign">
            <span class="new-campaign-symbol" aria-hidden="true">+</span>
            <span><strong>New campaign</strong><span>A new seed. An unexplored world.</span></span>
            <span class="new-campaign-arrow" aria-hidden="true">↗</span>
          </button>
          <p class="campaign-storage-note">
            Saved on this device. Export a campaign to take it with you.
          </p>
          <div class="campaign-feedback">
            <output id="campaign-message" class="campaign-message" aria-live="polite"></output>
            <button type="button" id="undo-delete-campaign" class="menu-button" hidden>
              Undo deletion
            </button>
          </div>
        </div>
      </section>
      <template id="campaign-template">
        <li class="campaign-card">
          <div class="campaign-icon">
            <img width="112" height="112" alt="" />
            <button
              type="button"
              class="menu-icon-button campaign-icon-refresh"
              data-action="shuffle"
              aria-label="Shuffle campaign icon"
              title="Choose another hex"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path d="M20 7v5h-5M4 17v-5h5M19 12a7 7 0 0 0-12-5L4 10m16 4-3 3a7 7 0 0 1-12-5" />
              </svg>
            </button>
          </div>
          <div class="campaign-details">
            <form class="campaign-name-form">
              <input
                class="campaign-name"
                type="text"
                maxlength="100"
                required
                autocomplete="off"
                spellcheck="false"
              />
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14Z" />
              </svg>
            </form>
            <dl class="campaign-metadata">
              <div>
                <dt>Created</dt>
                <dd class="campaign-date"></dd>
              </div>
              <div>
                <dt>Palette</dt>
                <dd class="campaign-palette"></dd>
              </div>
              <div>
                <dt>Settlements</dt>
                <dd class="campaign-settlements"></dd>
              </div>
              <div>
                <dt>POIs</dt>
                <dd class="campaign-pois"></dd>
              </div>
              <div class="campaign-ratio">
                <dt>Water / land</dt>
                <dd></dd>
              </div>
            </dl>
            <div class="campaign-seed-row">
              <span>Seed <span class="campaign-seed"></span></span>
              <button
                type="button"
                class="menu-icon-button"
                data-action="copy"
                aria-label="Copy seed"
                title="Copy seed"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  aria-hidden="true"
                >
                  <rect x="8" y="8" width="12" height="12" rx="2" />
                  <path d="M16 8V4H4v12h4" />
                </svg>
              </button>
              <button
                type="button"
                class="menu-icon-button"
                data-action="share"
                aria-label="Share map"
                title="Share map"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  aria-hidden="true"
                >
                  <circle cx="18" cy="5" r="3" />
                  <circle cx="6" cy="12" r="3" />
                  <circle cx="18" cy="19" r="3" />
                  <path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4" />
                </svg>
              </button>
            </div>
          </div>
          <div class="campaign-actions">
            <button
              type="button"
              class="menu-icon-button campaign-enter"
              data-action="enter"
              aria-label="Enter campaign"
              title="Enter campaign"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path d="M14 4h6v16h-6M3 12h13m-5-5 5 5-5 5" />
              </svg>
            </button>
            <button
              type="button"
              class="menu-icon-button"
              data-action="download"
              aria-label="Download campaign JSON"
              title="Download campaign JSON"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path d="M12 3v13m-5-5 5 5 5-5M4 16v5h16v-5" />
              </svg>
            </button>
            <button
              type="button"
              class="menu-icon-button campaign-delete"
              data-action="delete"
              aria-label="Delete campaign"
              title="Delete campaign"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7" />
              </svg>
            </button>
          </div>
        </li>
      </template>
      <section id="hex-smooth-riverlands" aria-label="World map" hidden>
        <header class="hp-top">
          <div>
            <h1 class="hp-title">The quiet frontier</h1>
            <p class="hp-seed">
              Seed <output id="hp-current-seed"></output>
              <button
                type="button"
                class="hp-seed-action"
                id="hp-copy-seed"
                aria-label="Copy seed"
                title="Copy seed"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  aria-hidden="true"
                >
                  <rect x="8" y="8" width="12" height="12" rx="2" />
                  <path d="M16 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h4" />
                </svg>
              </button>
              <button
                type="button"
                class="hp-seed-action"
                id="hp-share-map"
                aria-label="Share map"
                title="Share map"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  aria-hidden="true"
                >
                  <circle cx="18" cy="5" r="3" />
                  <circle cx="6" cy="12" r="3" />
                  <circle cx="18" cy="19" r="3" />
                  <path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4" />
                </svg>
              </button>
            </p>
          </div>
          <div class="hp-tools">
            <span class="hp-new-map-actions">
              <button type="button" id="hp-new-map">New Map</button>
              <button
                type="button"
                id="hp-map-settings"
                aria-label="New map settings"
                title="New map settings"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="17"
                  height="17"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  aria-hidden="true"
                >
                  <path
                    d="m9.5 3-.6 2.3-2 .9-2.1-.6-2.2 3.8 1.6 1.7v2.2l-1.6 1.7 2.2 3.8 2.1-.6 2 .9.6 2.3h4.4l.6-2.3 2-.9 2.1.6 2.2-3.8-1.6-1.7v-2.2l1.6-1.7-2.2-3.8-2.1.6-2-.9-.6-2.3Z"
                  />
                  <circle cx="11.7" cy="12" r="3.1" />
                </svg>
              </button>
            </span>
            <button type="button" id="hp-regenerate">Regenerate</button>
            <span class="hp-zooms">
              <button class="hp-zoom" id="hp-out" type="button" aria-label="Zoom out">−</button>
              <button class="hp-zoom" id="hp-in" type="button" aria-label="Zoom in">+</button>
            </span>
          </div>
        </header>
        <div class="hp-scene" id="hp-scene">
          <div class="hp-fallback" id="hp-loading">Preparing the landscape…</div>
        </div>
        <div class="hp-status">
          <select id="hp-selection" aria-label="Selected hex"></select>
          <span>Drag to pan · Scroll or pinch to zoom</span>
          <output id="hp-message" aria-live="polite"></output>
        </div>
        <form class="hp-palette" id="hp-palette-form">
          <div class="hp-colors">
            <label class="hp-color">
              <span class="hp-swatch">
                <input
                  type="color"
                  id="hp-ground"
                  value="#282039"
                  aria-label="Ground seed colour"
                />
              </span>
              <span>Ground<span class="hp-hex-code" id="hp-ground-value">#282039</span></span>
            </label>
            <label class="hp-color">
              <span class="hp-swatch">
                <input type="color" id="hp-water" value="#237d89" aria-label="Water seed colour" />
              </span>
              <span>Water<span class="hp-hex-code" id="hp-water-value">#237D89</span></span>
            </label>
            <label class="hp-color">
              <span class="hp-swatch">
                <input
                  type="color"
                  id="hp-elements"
                  value="#e5b96e"
                  aria-label="Elements seed colour"
                />
              </span>
              <span>Elements<span class="hp-hex-code" id="hp-elements-value">#E5B96E</span></span>
            </label>
          </div>
          <div class="hp-palette-controls">
            <select id="hp-preset" aria-label="Colour palette">
              <option value="dusk">Dusk &amp; gold</option>
              <option value="ember">Ember coast</option>
              <option value="moss">Moss &amp; bone</option>
              <option value="alien">Alien orchard</option>
              <option value="custom" hidden>Custom</option>
            </select>
            <label class="hp-sr-only" for="hp-palette-name">Palette name</label>
            <input
              id="hp-palette-name"
              type="text"
              maxlength="60"
              required
              placeholder="New palette name"
              autocomplete="off"
            />
            <button type="submit">Save palette</button>
          </div>
          <div class="hp-map-navigation">
            <label class="hp-motion">
              <input type="checkbox" id="hp-motion" checked />
              <span>Movement</span>
            </label>
            <button type="button" id="hp-return-menu">← Return to menu</button>
          </div>
        </form>
        <dialog id="hp-new-map-dialog" aria-labelledby="hp-dialog-title">
          <form id="hp-new-map-form" class="hp-new-map-form">
            <h2 id="hp-dialog-title">New Map</h2>
            <label for="hp-seed">Map seed</label>
            <input
              id="hp-seed"
              name="seed"
              type="text"
              maxlength="128"
              required
              autocomplete="off"
              spellcheck="false"
            />
            <div class="hp-tools">
              <button id="hp-cancel-new-map" type="button">Cancel</button>
              <button type="submit">Create map</button>
            </div>
          </form>
        </dialog>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
